name: Run iOS RN Harness tests
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ios.yml'
      - '.github/actions/setup/**'
      - 'packages/react-native-cloud-storage/**'
      - 'apps/example/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - '.github/workflows/build-ios.yml'
      - '.github/actions/setup/**'
      - 'packages/react-native-cloud-storage/**'
      - 'apps/example/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
jobs:
  test:
    name: Run iOS harness tests
    runs-on: macOS-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Select iOS runtime
        run: |
          version=$(xcrun simctl list --json | jq -er '
            . as $simulators | first(.runtimes[] | select(.isAvailable and
              any($simulators.devices[.identifier][]?; .isAvailable and .name == "iPhone 17 Pro")))
            | .version
          ')
          echo "HARNESS_IOS_VERSION=$version" >> "$GITHUB_ENV"
      - name: Test iOS file utilities
        timeout-minutes: 10
        run: pnpm package test:ios -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=$HARNESS_IOS_VERSION"
      - name: Install xcpretty
        run: gem install xcpretty
      - name: Build package
        run: pnpm package build
      - name: Build app
        run: "rm -rf ios && \
          npx expo prebuild -p ios && \
          cd ios && \
          set -o pipefail && xcodebuild \
          CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
          -derivedDataPath build -UseModernBuildSystem=YES \
          -workspace RNCloudStorage.xcworkspace \
          -scheme RNCloudStorage \
          -sdk iphonesimulator \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          build \
          CODE_SIGNING_ALLOWED=NO | xcpretty"
        working-directory: apps/example
      - name: Test native modules
        timeout-minutes: 10
        run: pnpm example test:harness:ios
        env:
          HARNESS_APP_PATH: ios/build/Build/Products/Debug-iphonesimulator/RNCloudStorage.app
