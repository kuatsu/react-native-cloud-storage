name: Build iOS
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ios.yml'
      - '.github/actions/setup/**'
      - 'packages/react-native-cloud-storage/**'
      - 'apps/example/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - '.github/workflows/build-ios.yml'
      - '.github/actions/setup/**'
      - 'packages/react-native-cloud-storage/**'
      - 'apps/example/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
jobs:
  build:
    name: Build iOS example app
    runs-on: macOS-26
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Select iOS runtime
        run: |
          version=$(xcrun simctl list devices available --json | jq -er '
            .devices | to_entries | first(.[] | select(any(.value[]; .name == "iPhone 17 Pro")))
            | .key | split(".iOS-")[1] | gsub("-"; ".")
          ')
          echo "HARNESS_IOS_VERSION=$version" >> "$GITHUB_ENV"
      - name: Test iOS file utilities
        run: pnpm package test:ios -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=$HARNESS_IOS_VERSION"
      - name: Install xcpretty
        run: gem install xcpretty
      - name: Build package
        run: pnpm package build
      - name: Build app
        run: "rm -rf ios && \
          npx expo prebuild -p ios && \
          cd ios && \
          set -o pipefail && xcodebuild \
          CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
          -derivedDataPath build -UseModernBuildSystem=YES \
          -workspace RNCloudStorage.xcworkspace \
          -scheme RNCloudStorage \
          -sdk iphonesimulator \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          build \
          CODE_SIGNING_ALLOWED=NO | xcpretty"
        working-directory: apps/example
      - name: Test native modules
        uses: callstackincubator/react-native-harness@v1.6.0
        with:
          projectRoot: apps/example
          runner: ios
          app: ios/build/Build/Products/Debug-iphonesimulator/RNCloudStorage.app
          packageManager: pnpm
