name: Build Android
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'
      - '.github/actions/setup/**'
      - 'packages/react-native-cloud-storage/**'
      - 'apps/example/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - '.github/workflows/build-android.yml'
      - '.github/actions/setup/**'
      - 'packages/react-native-cloud-storage/**'
      - 'apps/example/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
jobs:
  build:
    name: Build Android example app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build package
        run: pnpm package build
      - name: Build app
        run: |
          rm -rf android
          npx expo prebuild -p android
          cd android
          ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon
        working-directory: apps/example
      - name: Test native modules
        uses: callstackincubator/react-native-harness@v1.6.0
        with:
          projectRoot: apps/example
          runner: android
          app: android/app/build/outputs/apk/debug/app-debug.apk
          packageManager: pnpm
